<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pauta</title>
  <meta name="description" content="Agenda, escala de serviços, trocas, finanças, prazos e rotinas em um só app.">
  <meta name="theme-color" content="#f3f4f6">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pauta">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Aplica o tema salvo antes de desenhar, para não piscar.
    try {
      var t = JSON.parse(localStorage.getItem('pauta:v1') || '{}').settings?.theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Menu">
      <a class="brand" href="#/inicio"><span class="brand-mark" data-icon="check" data-size="18"></span><span>Pauta</span></a>
      <button type="button" class="btn btn-primary side-new" data-action="new-menu"><span data-icon="plus" data-size="18"></span>Adicionar</button>
      <nav class="side-nav" id="side-nav"></nav>
      <a href="#/ajustes" data-sync hidden></a>
    </aside>
    <div class="main">
      <header class="topbar">
        <a class="brand" href="#/inicio"><span class="brand-mark" data-icon="check" data-size="18"></span><span>Pauta</span></a>
        <div class="topbar-right">
          <a href="#/ajustes" data-sync hidden></a>
          <a class="icon-btn" href="#/ajustes" aria-label="Ajustes" data-icon="settings" data-size="22"></a>
        </div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Navegação principal"></nav>
  <button type="button" class="fab" data-action="new-menu" aria-label="Adicionar" data-icon="plus" data-size="26"></button>
  <div id="timerbar" hidden></div>
  <div id="overlay-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <noscript><p style="padding:24px">Ative o JavaScript para usar o Pauta.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
